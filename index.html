<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office Board</title>
<!-- Load Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --office: #40c776; --remote: #346ab9; --mission: #eb5b22; --leave: #fcff64; --sick: #fd3d3d; --ops: #15803d; 
    --training: #32a8ac; --custom: #5f5f5f;
  }
  * { box-sizing: border-box; margin: 0; font-family: system-ui, sans-serif; }
  body { background: #f4f6f8; padding: 16px; }
  h1 { font-size: 22px; margin-bottom: 12px; color: #1f2937; }
  select, button, input { font-size: 16px; padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; }
  .muted { color: #6b7280; font-size: 14px; margin-bottom: 12px; }
  .day { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .day h3 { font-size: 17px; margin-bottom: 10px; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt { flex: 1; min-width: 90px; padding: 12px 6px; text-align: center; border: 2px solid #e5e7eb; border-radius: 10px; background: #fff; font-size: 14px; transition: background 0.1s; touch-action: manipulation; user-select: none; }
  .opt.sel { color: #fff; font-weight: 600; border-color: transparent; }
  .opt.sel[data-s="office"]   { background: var(--office); }
  .opt.sel[data-s="remote"]   { background: var(--remote); }
  .opt.sel[data-s="mission"]  { background: var(--mission); }
  .opt.sel[data-s="leave"]    { background: var(--leave); color: #000; }
  .opt.sel[data-s="sick"]     { background: var(--sick); }
  .opt.sel[data-s="ops"]      { background: var(--ops); }
  .opt.sel[data-s="training"] { background: var(--training); }
  .opt.sel[data-s="custom"]   { background: var(--custom); }

  table.board { border-collapse: collapse; width: 100%; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .board th, .board td { padding: 14px 10px; text-align: center; font-size: 26px; }
  .board th { background: #1f2937; color: #fff; font-size: 24px; }
  .board th:first-child { text-align: left; }
  .board td:first-child { text-align: left; font-weight: 600; font-size: 26px; padding-left: 18px; }
  .board tr:nth-child(2n) td { background: #fafafa; }
  .cell { display: inline-block; width: 46px; height: 46px; border-radius: 10px; line-height: 46px; }
  .cell.office { background: var(--office); } .cell.remote { background: var(--remote); }
  .cell.mission { background: var(--mission); } .cell.leave { background: var(--leave); }
  .cell.sick { background: var(--sick); } .cell.ops { background: var(--ops); }
  .cell.training { background: var(--training); } .cell.custom { background: var(--custom); }
  .cell.none { background: #e5e7eb; opacity: .5; }
  .legend { display: flex; gap: 18px; margin: 14px 0; font-size: 18px; align-items: center; flex-wrap: wrap; }
  .legend .cell { width: 22px; height: 22px; line-height: 22px; border-radius: 5px; }
  .weeknav { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  
  #authGate { position: fixed; inset: 0; background: #f4f6f8; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #authGate form { display: flex; flex-direction: column; gap: 12px; width: 300px; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
</style>
</head>
<body>

<!-- Authentication -->
<div id="authGate" style="display: none;">
  <form onsubmit="checkPin(event)">
    <h2>Office Board Login</h2>
    <input type="password" id="pinInput" placeholder="Enter password" required>
    <button type="submit" style="background: #1f2937; color: #fff;">Unlock</button>
    <p id="pinError" style="color: red; font-size: 14px; display: none;">Incorrect PIN</p>
  </form>
</div>

<div id="app"><p class="muted">Loading...</p></div>

<script>
  const SUPABASE_URL = 'https://jsiwrftddnbwxnoeobql.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_SJP_t1JMS8qx39nU4A2yAg_WzPbDU0v';
  
  const STATUSES = {
    office:   { label: 'In Office', icon: '🏢' },
    remote:   { label: 'Teleworking', icon: '🏠' },
    mission:  { label: 'On Mission', icon: '✈️' },
    leave:    { label: 'On Leave', icon: '🌴' },
    sick:     { label: 'Sick', icon: '🤒' },
    training: { label: 'In Training', icon: '📝' },
    ops:      { label: 'In Ops', icon: '🎧' },
    custom:   { label: 'Custom', icon: '🪐' }
  };
  const STATUS_ORDER = ['mission', 'remote', 'leave', 'sick', 'training', 'ops', 'office', 'custom'];
  
  // =================================================

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  
  let currentWeekOffset = 0;
  let selectedPerson = localStorage.getItem('savedPerson') || '';
  let appData = { people: [], entries: {}, days: [], dayLabels: {} };
  
  const urlParams = new URLSearchParams(window.location.search);
  const isViewMode = urlParams.get('mode') === 'view';

  if (localStorage.getItem('office_auth') !== 'true') {
    document.getElementById('authGate').style.display = 'flex';
  } else {
    initApp();
  }

  function checkPin(e) {
    e.preventDefault();
    const input = document.getElementById('pinInput').value;
    
    if (btoa(input) === 'M0MwU19UMF9USDNfTTAwTiE=') {
      localStorage.setItem('office_auth', 'true');
      document.getElementById('authGate').style.display = 'none';
      initApp();
    } else {
      document.getElementById('pinError').style.display = 'block';
    }
  }

  function initApp() {
    loadData();
    sb.channel('realtime_entries').on('postgres_changes', { event: '*', schema: 'public', table: 'entries' }, payload => {
      loadData(); 
    }).subscribe();
  }

  // --- Date Math ---
  function getWeekDates(offset) {
    const now = new Date();
    now.setHours(0, 0, 0, 0);
    const dayIndex = (now.getDay() + 6) % 7; 
    
    const monday = new Date(now);
    monday.setDate(now.getDate() - dayIndex + (parseInt(offset) || 0) * 7);
    
    const days = [];
    const dayLabels = {};
    for (let i = 0; i < 5; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const dateStr = String(d.getDate()).padStart(2, '0');
      const key = `${year}-${month}-${dateStr}`;
      
      days.push(key);
      dayLabels[key] = d.toLocaleDateString(undefined, { weekday: 'short', month: '2-digit', day: '2-digit' });
    }
    return { days, dayLabels };
  }

  // --- Database Logic ---
  async function loadData() {
    const { days, dayLabels } = getWeekDates(currentWeekOffset);
    appData.days = days;
    appData.dayLabels = dayLabels;

    const [ { data: peopleList }, { data: entriesList } ] = await Promise.all([
      sb.from('people').select('id').order('id'),
      sb.from('entries').select('*').in('date', days)
    ]);

    appData.people = peopleList.map(p => p.id);
    if (!selectedPerson && appData.people.length > 0) {
      selectedPerson = appData.people[0];
    }

    appData.entries = {};
    appData.people.forEach(p => appData.entries[p] = {});
    
    entriesList.forEach(e => {
      if (appData.entries[e.person]) appData.entries[e.person][e.date] = e.status;
    });

    render();
  }

async function updateStatus(person, dateStr, key) {
    if (!appData.entries[person]) appData.entries[person] = {};
    
    const currentRaw = appData.entries[person][dateStr] || '';
    const currentBase = currentRaw.startsWith('custom') ? 'custom' : currentRaw;

    // clear entry
    if (currentBase === key) {
      delete appData.entries[person][dateStr];
      render();
      await sb.from('entries').delete().eq('person', person).eq('date', dateStr);
      return;
    }

    let saveStatus = key;
    
    // Prompt for text if custom
    if (key === 'custom') {
      const userInput = prompt('Enter your custom status:');
      if (userInput === null) return;
      saveStatus = userInput.trim() ? `custom:${userInput.trim()}` : 'custom';
    }

    appData.entries[person][dateStr] = saveStatus;
    render();

    // Save to db in the bg
    await sb.from('entries').upsert({ person: person, date: dateStr, status: saveStatus });
  }

  async function clearStatus(person, dateStr) {
    if (appData.entries[person] && appData.entries[person][dateStr]) {
      // Remove from UI immediately
      delete appData.entries[person][dateStr];
      render();
      
      // Delete from database in the bg
      await sb.from('entries').delete().eq('person', person).eq('date', dateStr);
    }
  }

  function changePerson(personId) {
    selectedPerson = personId;
    localStorage.setItem('savedPerson', personId);
    render();
  }

  function changeWeek(offset) {
    currentWeekOffset += offset;
    document.getElementById('app').innerHTML = '<p class="muted">Loading…</p>';
    loadData();
  }

  // --- UI stuff ---
  function render() {
    let html = `
      <div class="weeknav">
        <button onclick="changeWeek(-1)">◀ Prev</button>
        <button onclick="currentWeekOffset=0; changeWeek(0)">Current</button>
        <button onclick="changeWeek(1)">Next ▶</button>
      </div>
    `;

    if (!isViewMode) {
      html += `
        <h1>My Status</h1>
        <select onchange="changePerson(this.value)" style="margin-bottom: 16px;">
          ${appData.people.map(p => `<option value="${p}" ${p === selectedPerson ? 'selected' : ''}>${p}</option>`).join('')}
        </select>
      `;

      appData.days.forEach(day => {
        const rawStatus = appData.entries[selectedPerson]?.[day] || '';
        const baseStatus = rawStatus.startsWith('custom') ? 'custom' : rawStatus;
        const customText = rawStatus.startsWith('custom:') ? rawStatus.substring(7) : '';

        html += `
          <div class="day">
            <h3>${appData.dayLabels[day]}</h3>
            <div class="opts">
              ${STATUS_ORDER.map(key => {
                const isSel = baseStatus === key;
                let displayLabel = STATUSES[key].label;
                
                if (key === 'custom' && isSel && customText) {
                  displayLabel = customText;
                }

                return `
                  <div class="opt ${isSel ? 'sel' : ''}" data-s="${key}" 
                       onclick="updateStatus('${selectedPerson}', '${day}', '${key}')"
                       ondblclick="clearStatus('${selectedPerson}', '${day}')"
                       title="Double-click to clear">
                    ${STATUSES[key].icon}${displayLabel}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });
    }

    html += `
      <h1 style="${isViewMode ? 'margin-top: 0;' : 'margin-top: 24px;'}">Office Board</h1>
      <div class="legend">
        ${STATUS_ORDER.map(key => `
          <div style="display:flex; align-items:center; gap:6px;">
            <div class="cell ${key}"></div> <span>${STATUSES[key].label}</span>
          </div>
        `).join('')}
      </div>
      
      <table class="board">
        <tr>
          <th>Person</th>
          ${appData.days.map(d => `<th>${appData.dayLabels[d]}</th>`).join('')}
        </tr>
        ${appData.people.map(p => `
          <tr>
            <td>${p}</td>${appData.days.map(d => {
              const rawS = appData.entries[p]?.[d];
              const s = rawS?.startsWith('custom') ? 'custom' : rawS;
              const tooltip = rawS?.startsWith('custom:') ? rawS.substring(7) : (s ? STATUSES[s].label : '');
              
              return `<td>
                <div class="cell ${s ? s : 'none'}" title="${tooltip}">${s ? STATUSES[s].icon : ''}</div>
              </td>`;
            }).join('')}
          </tr>
        `).join('')}
      </table>
    `;

    document.getElementById('app').innerHTML = html;
  }
</script>
</body>
</html>
